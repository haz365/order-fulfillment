{{- $root := . -}}
{{- range $name, $svc := .Values.services -}}
{{- if ne $name "apiGateway" -}}
{{- $appName := $name | replace "Service" "-service" | replace "Api" "-api" | lower | trimPrefix "-" -}}
{{- $appName = regexReplaceAll "([A-Z])" $appName "-${1}" | lower | trimPrefix "-" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $appName }}
  namespace: order-fulfillment
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $appName }}
  template:
    metadata:
      labels:
        app: {{ $appName }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ $appName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ $appName }}
          image: {{ $root.Values.global.registry }}/{{ $svc.image }}:{{ $root.Values.global.imageTag }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: PORT
              value: {{ $svc.port | quote }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            failureThreshold: 30
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $appName }}
  namespace: order-fulfillment
  {{- if $svc.irsaRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $svc.irsaRoleArn }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $appName }}
  namespace: order-fulfillment
spec:
  selector:
    app: {{ $appName }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
  type: ClusterIP
{{- if $svc.hpa }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $appName }}
  namespace: order-fulfillment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $appName }}
  minReplicas: {{ $svc.hpa.minReplicas }}
  maxReplicas: {{ $svc.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.hpa.targetCPU }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $appName }}
  namespace: order-fulfillment
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $appName }}
{{- end }}
{{- end }}