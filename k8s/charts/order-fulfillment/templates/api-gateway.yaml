apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: order-fulfillment
spec:
  replicas: {{ .Values.services.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.services.apiGateway.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api-gateway
          image: {{ .Values.global.registry }}/{{ .Values.services.apiGateway.image }}:{{ .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.apiGateway.port }}
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: API_KEY
            - name: ORDER_SERVICE_URL
              value: http://order-service:8001
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8002
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8003
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8004
            - name: SHIPPING_SERVICE_URL
              value: http://shipping-service:8005
            - name: DASHBOARD_SERVICE_URL
              value: http://dashboard-api:8009
          resources:
            {{- toYaml .Values.services.apiGateway.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.services.apiGateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.apiGateway.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.apiGateway.port }}
            failureThreshold: 30
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: order-fulfillment
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: order-fulfillment
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: {{ .Values.services.apiGateway.port }}
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: order-fulfillment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: {{ .Values.services.apiGateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.apiGateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.apiGateway.hpa.targetCPU }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: order-fulfillment
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway