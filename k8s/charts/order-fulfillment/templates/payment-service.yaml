apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: order-fulfillment
spec:
  replicas: {{ .Values.services.paymentService.replicas }}
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.services.paymentService.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: payment-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: payment-service
          image: {{ .Values.global.registry }}/{{ .Values.services.paymentService.image }}:{{ .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.paymentService.port }}
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          resources:
            {{- toYaml .Values.services.paymentService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.paymentService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.paymentService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.paymentService.port }}
            failureThreshold: 30
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: order-fulfillment
  {{- if .Values.services.paymentService.irsaRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.services.paymentService.irsaRoleArn }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: order-fulfillment
spec:
  selector:
    app: payment-service
  ports:
    - port: {{ .Values.services.paymentService.port }}
      targetPort: {{ .Values.services.paymentService.port }}
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
  namespace: order-fulfillment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: {{ .Values.services.paymentService.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.paymentService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.paymentService.hpa.targetCPU }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service
  namespace: order-fulfillment
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment-service