apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-fulfillment-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: order-fulfillment

  source:
    repoURL: https://github.com/haz365/order-fulfillment
    targetRevision: main
    path: k8s/charts/order-fulfillment
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: order-fulfillment-prod

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m