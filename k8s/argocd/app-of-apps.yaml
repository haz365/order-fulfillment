apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-fulfillment
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: order-fulfillment
  source:
    repoURL: https://github.com/haz365/order-fulfillment
    targetRevision: main
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true