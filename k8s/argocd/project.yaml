apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: order-fulfillment
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Order Fulfillment Platform

  sourceRepos:
    - https://github.com/haz365/order-fulfillment

  destinations:
    - namespace: order-fulfillment
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  roles:
    - name: admin
      policies:
        - p, proj:order-fulfillment:admin, applications, *, order-fulfillment/*, allow