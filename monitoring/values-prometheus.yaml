grafana:
  enabled: true
  adminPassword: grafana123!

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - orders.hasanali.uk
    path: /grafana
    tls:
      - secretName: grafana-tls
        hosts:
          - orders.hasanali.uk

  grafana.ini:
    server:
      root_url: https://orders.hasanali.uk/grafana
      serve_from_sub_path: true

prometheus:
  enabled: true
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: order-fulfillment
        static_configs:
          - targets:
              - api-gateway.order-fulfillment.svc.cluster.local:8000
              - order-service.order-fulfillment.svc.cluster.local:8001
              - inventory-service.order-fulfillment.svc.cluster.local:8002
              - payment-service.order-fulfillment.svc.cluster.local:8003
              - notification-service.order-fulfillment.svc.cluster.local:8004
              - shipping-service.order-fulfillment.svc.cluster.local:8005
              - worker.order-fulfillment.svc.cluster.local:8006
              - scheduler.order-fulfillment.svc.cluster.local:8007
              - dashboard-api.order-fulfillment.svc.cluster.local:8009
        metrics_path: /metrics

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'null'
    receivers:
      - name: 'null'

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true