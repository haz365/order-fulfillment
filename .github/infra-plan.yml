name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: eu-west-2

jobs:
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          soft_fail: true
          output_format: cli
          download_external_modules: false

  plan-network:
    name: Plan Network
    runs-on: ubuntu-latest
    needs: checkov
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::989346120260:role/order-fulfillment-dev-github-actions
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Plan Network
        working-directory: infra/state/network
        run: |
          terraform init
          terraform plan -no-color 2>&1 | tee plan.txt

      - name: Post plan
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/state/network/plan.txt', 'utf8');
            const truncated = plan.length > 30000 ? plan.slice(-30000) : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Network Layer Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

  plan-cluster:
    name: Plan Cluster
    runs-on: ubuntu-latest
    needs: checkov
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::989346120260:role/order-fulfillment-dev-github-actions
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Plan Cluster
        working-directory: infra/state/cluster
        run: |
          terraform init
          terraform plan -no-color 2>&1 | tee plan.txt

      - name: Post plan
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/state/cluster/plan.txt', 'utf8');
            const truncated = plan.length > 30000 ? plan.slice(-30000) : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Cluster Layer Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

  plan-addons:
    name: Plan Addons
    runs-on: ubuntu-latest
    needs: checkov
