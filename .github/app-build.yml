name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - 'services/order-service/**'
      - 'services/inventory-service/**'
      - 'services/payment-service/**'
      - 'services/notification-service/**'
      - 'services/shipping-service/**'
      - 'services/worker/**'
      - 'services/scheduler/**'
      - 'services/dashboard-api/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION:  eu-west-2
  ACCOUNT:     989346120260
  REGISTRY:    989346120260.dkr.ecr.eu-west-2.amazonaws.com
  PROJECT:     order-fulfillment

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          SERVICES=()
          for svc in api-gateway order-service inventory-service payment-service \
                     notification-service shipping-service worker scheduler dashboard-api; do
            if git diff --name-only HEAD~1 HEAD | grep -q "services/$svc/"; then
              SERVICES+=("$svc")
            fi
          done
          if [ ${#SERVICES[@]} -eq 0 ]; then
            # On workflow_dispatch build all
            SERVICES=(api-gateway order-service inventory-service payment-service \
                      notification-service shipping-service worker scheduler dashboard-api)
          fi
          echo "services=$(echo ${SERVICES[@]} | tr ' ' ',')" >> $GITHUB_OUTPUT
          echo "Changed services: ${SERVICES[@]}"

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != ''
    strategy:
      matrix:
        service: ${{ fromJson(format('["{0}"]', replace(needs.detect-changes.outputs.services, ',', '","'))) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::989346120260:role/order-fulfillment-dev-github-actions
          aws-region: eu-west-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          docker build \
            --platform linux/amd64 \
            -f services/${{ matrix.service }}/Dockerfile \
            -t $REGISTRY/$PROJECT/${{ matrix.service }}:${{ steps.tag.outputs.sha }} \
            .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ matrix.service }}:${{ steps.tag.outputs.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ matrix.service }}:${{ steps.tag.outputs.sha }}
          format: spdx-json
          output: sbom-${{ matrix.service }}.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Push image
        run: |
          docker push $REGISTRY/$PROJECT/${{ matrix.service }}:${{ steps.tag.outputs.sha }}

      - name: Sign image
        run: |
          cosign sign --yes \
            $REGISTRY/$PROJECT/${{ matrix.service }}:${{ steps.tag.outputs.sha }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json

  update-values:
    name: Update image tags
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Update values-dev.yaml
        run: |
          SHA=${{ steps.tag.outputs.sha }}
          sed -i "s/imageTag:.*/imageTag: ${SHA}/" k8s/charts/order-fulfillment/values-dev.yaml

      - name: Commit updated values
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/charts/order-fulfillment/values-dev.yaml
          git diff --staged --quiet || git commit -m "ci: update image tag to ${GITHUB_SHA::7}"
          git push