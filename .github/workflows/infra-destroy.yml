name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'destroy' to confirm"
        required: true
      environment:
        description: "Environment to destroy"
        required: true
        default: dev
        type: choice
        options: [dev]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  validate:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation failed. Type 'destroy' to proceed."
            exit 1
          fi

  destroy-addons:
    name: Destroy Addons
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::989346120260:role/order-fulfillment-dev-github-actions
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Destroy Addons
        working-directory: infra/state/addons
        run: |
          terraform init
          terraform destroy -auto-approve

  destroy-cluster:
    name: Destroy Cluster
    runs-on: ubuntu-latest
    needs: destroy-addons
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::989346120260:role/order-fulfillment-dev-github-actions
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Destroy Cluster
        working-directory: infra/state/cluster
        run: |
          terraform init
          terraform destroy -auto-approve

  destroy-network:
    name: Destroy Network
    runs-on: ubuntu-latest
    needs: destroy-cluster
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::989346120260:role/order-fulfillment-dev-github-actions
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Destroy Network
        working-directory: infra/state/network
        run: |
          terraform init
          terraform destroy -auto-approve